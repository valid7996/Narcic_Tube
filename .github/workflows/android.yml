# NarcicTub Android CI — Phase 15.
# Runs the unit test suite, builds the debug APK, and uploads it as an
# artifact. No signing, no publishing, no secrets (release belongs to a
# later phase).
name: Android CI

on:
  push:
    branches: [main]
    # PHASE 16: version tags drive the signed release job below.
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  # PHASE 16: manual run for release validation. The release job still only
  # produces artifacts — nothing is published to GitHub Releases/Play.
  workflow_dispatch:

# Least privilege: the workflow only ever reads the repository. No write
# scopes exist, so even a compromised step cannot mutate repo state.
permissions:
  contents: read

# One run per ref: a new push to the same branch cancels the superseded run.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Fixed shell for every run step — no dynamic command construction anywhere.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test & build debug APK
    # Pinned runner image (no floating "latest") for reproducible tooling.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        # Official action, pinned to a major version tag. Commit-SHA pinning
        # is the recommended hardening follow-up (see Phase 15 report).
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        # Official Gradle action: verifies gradle-wrapper.jar checksums.
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17 (Temurin)
        # Project toolchain: build.gradle.kts targets Java 17 (AGP 8.5.2).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle caching
        # Official Gradle action: caches dependencies + build outputs.
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache poisoning guard: pull-request runs RESTORE caches but
          # never SAVE them; only pushes to main write caches.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        # gradlew is committed without the executable bit (Windows checkout).
        run: chmod +x gradlew

      - name: Run unit tests
        # Test failure fails the workflow — no error swallowing anywhere.
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NarcicTub-debug-apk
          # Exact known build output only — never the workspace, .gradle,
          # .git, local.properties or any keystore (none exists in-repo).
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Signed release APK & AAB
    # PHASE 16: tag-based release builds (v*.*.*) — plain pushes/PRs never
    # run this job, so signing secrets can never reach PR code. It runs
    # after the debug smoke build and produces signed APK + AAB artifacts.
    # Nothing is published to GitHub Releases or Google Play here.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # انتشار GitHub Release نیاز به نوشتن contents دارد
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          # Tag pushes come from the trusted ref — caches may be saved.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Honest secret handling: if any signing secret is missing, fail with
      # HONEY RELEASES: signing material lives in the (private) repo —
      # keystore.properties + keystore/*.jks — so no secrets setup is needed
      # here. This job publishes a real GitHub Release with per-ABI APKs.
      - name: Build signed release APKs (per ABI + universal) and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Generate SHA-256 checksums
        run: |
          cd app/build/outputs
          sha256sum apk/release/*.apk bundle/release/*.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Narcic Tube ${GITHUB_REF_NAME}" \
            --notes "Signed release build.

          **Which APK?**
          - \`arm64-v8a\` — most modern phones ✅
          - \`armeabi-v7a\` — older 32-bit phones
          - \`x86_64\` — emulators / Intel devices
          - \`universal\` — works on everything (larger)

          Install the matching APK, or grab the \`.aab\` if you need it for Play." \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/SHA256SUMS.txt

      - name: Upload signed release artifacts (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: NarcicTube-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
